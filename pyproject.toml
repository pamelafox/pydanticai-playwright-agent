[project]
name = "pydanticai-playwright-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "azure-identity>=1.19.0",
    "azure-monitor-opentelemetry-exporter>=1.0.0b55",
    "openai>=1.109.1",
    "python-dotenv>=1.0.0",
    "pydantic-ai>=2.18.0",
    "logfire>=4.32.0",
    "pydantic-ai-harness[playwright] @ git+https://github.com/pydantic/pydantic-ai-harness.git@3f77a98",
]

[tool.uv]
prerelease = "allow"

[tool.ruff]
line-length = 120
target-version = "py310"
lint.select = ["E", "F", "I", "UP"]
lint.ignore = ["D203"]
